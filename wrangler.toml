# Cloudflare deployment for Blend Calc.
#
# A static-assets-only Worker: no server code. Like RFutils and unlike the
# recorded demos in the fleet, this one IS built by Cloudflare — it's plain Vite,
# and it is the real tool rather than a recording, so there is nothing to capture
# ahead of time and `dist/` stays out of git. Set the build command in the
# Cloudflare project to:
#
#   npm ci && npm run build
#
# Without this file, `wrangler deploy` looks for a static directory at the repo
# root, finds none (the build output is under dist/), and fails with
# "Could not detect a directory containing static files".
#
# `public/_headers` is copied into dist/ by Vite and carries the CSP and the
# immutable-cache rule for hashed assets; the assets runtime honours it.
#
# `name` must match the Cloudflare project. Change it here if the project was
# created under a different one.

name = "blend-calc"
compatibility_date = "2026-07-30"

[assets]
directory = "./dist"
